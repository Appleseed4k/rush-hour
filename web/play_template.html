<!--
Rush Hour play page. Built by web/build_play.py, which puts the puzzle sample
in place of the PUZZLES marker below and the teacher ("none", "delay:<seconds>" or
"bayes3:<seconds>[:<name>=<value>,...]", see the teacher section) in place of the
TEACHER marker; published as a claude.ai artifact with
capabilities {"db": {"rules": [{"path": "plays", "read": "owner", "write": "owner"},
{"path": "plays/{self}", "read": "interact", "write": "interact"}]}, "user": {},
"downloads": true}. Each game is saved to plays/<user id>/games/<session>-<n>;
the owner gets an Export button that saves every game as one JSON file, which
scripts/play_data.py reads.
-->
<title>Rush Hour Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one column - the tray as the hero, controls under it, nothing else. */
:root {
  --bg: #eef0ec;
  --fg: #1f2422;
  --muted: #5d6662;
  --tray: #2c3640;
  --tray-edge: #1d252c;
  --well: #dde1da;
  --grid: #c9cfc7;
  --accent: #d32f28;
  --focus: #2364b0;
  --warn: #9a5b12;
  --car-1: #e8b53a; --car-2: #3fa39a; --car-3: #6a9b4d; --car-4: #8a63b8; --car-5: #e07b39;
  --car-6: #3e78c4; --car-7: #c8558f; --car-8: #8c7a55; --car-9: #4fb3d9; --car-10: #b3a13a;
  --car-11: #6e7fa8; --car-12: #a7623a; --car-13: #2e8b57; --car-14: #d98aa8; --car-15: #7c8c3a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141816; --fg: #e5e9e6; --muted: #99a29d; --tray: #0c1013; --tray-edge: #050708;
    --well: #252b28; --grid: #313935; --accent: #e5463d; --focus: #6aa5ef;
    --warn: #e2a457; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141816; --fg: #e5e9e6; --muted: #99a29d; --tray: #0c1013; --tray-edge: #050708;
  --well: #252b28; --grid: #313935; --accent: #e5463d; --focus: #6aa5ef;
  --warn: #e2a457; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 32px;
}
.page { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.tray {
  position: relative;
  background: var(--tray);
  border-radius: 14px;
  padding: 3.2%;
  box-shadow: inset 0 -6px 0 var(--tray-edge);
  max-width: 100%;
}
.board {
  position: relative;
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 6px;
  background-color: var(--well);
  background-image:
    linear-gradient(var(--grid) 1.5px, transparent 1.5px),
    linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size: calc(100% / 6) calc(100% / 6);
  touch-action: none;
}
.exit {
  position: absolute;
  right: 0;
  top: calc(3.2% + (100% - 6.4%) * 2 / 6);
  height: calc((100% - 6.4%) / 6);
  width: 3.2%;
  background: var(--well);
  display: flex; align-items: center; justify-content: center;
}
.exit::after {
  content: "";
  border-left: 7px solid var(--accent);
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}
.car {
  position: absolute;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: grab;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.car::before {
  content: "";
  position: absolute;
  inset: 5%;
  border-radius: 10px;
  background: var(--paint);
  background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 45%);
  box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
}
.car.h::before { inset: 9% 3%; }
.car.v::before { inset: 3% 9%; }
.car:focus-visible { outline: none; }
.car:focus-visible::before { box-shadow: 0 0 0 3px var(--focus); }
.car.dragging { cursor: grabbing; z-index: 2; }
.car.dragging::before { box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25); }
.car.settle { transition: transform 140ms ease-out; }
.car.leaving { transition: transform 420ms ease-in; }
.car.teaching { transition: transform 320ms ease-in-out; }
.car.taught::before { animation: taught 1.4s ease-out; }
@keyframes taught {
  from { box-shadow: 0 0 0 4px var(--focus), inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
  to { box-shadow: 0 0 0 4px transparent, inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
}

.banner {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.banner p {
  margin: 0; padding: 10px 18px; border-radius: 999px;
  background: var(--bg); color: var(--fg);
  font-family: var(--display); font-weight: 600; font-size: 1.15rem;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
}

.controls { display: flex; gap: 10px; flex-wrap: wrap; }
button.act {
  font: inherit; font-weight: 700;
  border-radius: 10px; padding: 10px 16px;
  border: 1.5px solid var(--fg); background: transparent; color: var(--fg);
  cursor: pointer;
}
button.act.primary { background: var(--fg); color: var(--bg); }
button.act:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button.act[disabled] { opacity: 0.4; cursor: default; }
.spacer { flex: 1; }

button.act.quiet { border-color: var(--muted); color: var(--muted); font-weight: 400; }
.problem { margin: 0; font-size: 0.85rem; color: var(--warn); }

/* The owner's testing slider for the teacher's wait: quiet, under the controls. */
.tuning { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--muted); }
.tuning[hidden] { display: none; }
.tuning .note { font-size: 0.8rem; }
.tuning input { flex: 1; min-width: 0; accent-color: var(--fg); }
.tuning input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.tuning output { min-width: 4.5em; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .car.settle, .car.leaving, .car.teaching { transition: none; }
  .car.taught::before { animation: none; }
}
</style>

<div class="page">
  <div class="tray">
    <div class="board" id="board" role="group" aria-label="Rush Hour board, 6 by 6"></div>
    <div class="exit" aria-hidden="true"></div>
  </div>

  <div class="controls">
    <button class="act" id="restart" type="button">Restart puzzle</button>
    <button class="act" id="give-up" type="button">Give up</button>
    <span class="spacer"></span>
    <button class="act primary" id="next" type="button" hidden>Next puzzle</button>
    <button class="act quiet" id="export" type="button" hidden>Export games</button>
  </div>

  <div class="tuning" id="tuning" hidden>
    <label for="delay">Teacher wait <span class="note">(testing)</span></label>
    <input type="range" id="delay" min="0" max="30" step="1">
    <output id="delay-out" for="delay"></output>
  </div>

  <p class="problem" id="problem" role="status" hidden></p>
</div>

<script>
(() => {
  const POOL = "/*PUZZLES*/".split(" ").map((s, i) => {
    const [d, b] = s.split(":");
    return { index: i, distance: Number(d), board: b };
  });
  const TEACHER = "/*TEACHER*/";
  const [KIND, SECONDS, PARAMS] = TEACHER.split(":");
  // The teacher's wait, ms (null: no teacher). The owner's testing slider may change it; games record when.
  let delay = KIND === "delay" || KIND === "bayes3" ? Number(SECONDS) * 1000 : null;
  const BAYES3 = {};  // parameters given in the spec, over Bayes3's defaults
  if (KIND === "bayes3" && PARAMS) {
    for (const item of PARAMS.split(",")) {
      const [name, value] = item.split("=");
      BAYES3[name] = Number(value);
    }
  }

  // BAYES3-MODEL-START
  // The Bayesian teacher's model of the player: scripts/teach.py's Bayesian3 ("bayes3"), ported line for line
  // (the simulated students' default teacher). Distances are to the goal; a board's distance is k, and `moves`
  // counts every move made on the puzzle so far (restarts and the teacher's included), as `_offset + step` does.
  // - Skill: a logit per distance to the goal (1, 2, ..., 10, 11 or more) that a move of the player's own is
  //   optimal, drawn around their overall level; refitted (MAP) after every puzzle, older puzzles weighted by
  //   `decay` per puzzle since (the last `window` kept).
  // - This puzzle's difficulty for them: a shift of all those logits, normal with sd tau (fitted), updated after
  //   every move of their own on it.
  // - Mistakes: the share that go a move further from the goal rather than sideways, per distance.
  // - The plan: from k, each move of their own goes to k - 1 with their skill there, else to k + 1 (that share)
  //   or stays at k, until red is out or the move cap (`step_factor` x the optimal length, at least
  //   `min_steps`). Backward induction gives their chance of solving alone from every (moves made, difficulty, k).
  // The teacher shows the optimal move when that chance, averaged over its belief about this puzzle's
  // difficulty, is under `theta`.
  const B3 = { BINS: 11, Z: Array.from({ length: 13 }, (_, i) => -3 + 0.5 * i) };
  B3.LOG_PZ = (() => {
    const e = B3.Z.map((z) => -0.5 * z * z);
    const s = Math.log(e.reduce((a, x) => a + Math.exp(x), 0));
    return e.map((x) => x - s);
  })();
  const logSigmoid = (x) => (x >= 0 ? -Math.log1p(Math.exp(-x)) : x - Math.log1p(Math.exp(x)));
  const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
  function softmax(x) {
    const top = Math.max(...x), e = x.map((v) => Math.exp(v - top)), s = e.reduce((a, v) => a + v, 0);
    return e.map((v) => v / s);
  }

  // Minimises f (returning [value, gradient]) from x0: L-BFGS with a backtracking line search.
  function lbfgs(f, x0, maxIter = 500) {
    let x = x0.slice(), [fx, g] = f(x);
    let S = [], Y = [];
    for (let it = 0; it < maxIter; it++) {
      if (Math.max(...g.map(Math.abs)) < 1e-6) break;
      const q = g.slice(), alpha = [];
      for (let i = S.length - 1; i >= 0; i--) {
        alpha[i] = dot(S[i], q) / dot(Y[i], S[i]);
        for (let j = 0; j < q.length; j++) q[j] -= alpha[i] * Y[i][j];
      }
      const last = S.length - 1;
      const gamma = last >= 0 ? dot(S[last], Y[last]) / dot(Y[last], Y[last]) : 1 / Math.max(1, Math.sqrt(dot(g, g)));
      const r = q.map((v) => v * gamma);
      for (let i = 0; i < S.length; i++) {
        const beta = dot(Y[i], r) / dot(Y[i], S[i]);
        for (let j = 0; j < r.length; j++) r[j] += S[i][j] * (alpha[i] - beta);
      }
      let dir = r.map((v) => -v), slope = dot(g, dir);
      if (!(slope < 0)) { S = []; Y = []; dir = g.map((v) => -v); slope = -dot(g, g); }
      let t = 1, xn = x, fn = fx, gn = g;
      for (let ls = 0; ls < 60; ls++, t *= 0.5) {
        xn = x.map((v, j) => v + t * dir[j]);
        [fn, gn] = f(xn);
        if (Number.isFinite(fn) && fn <= fx + 1e-4 * t * slope) break;
      }
      if (!(Number.isFinite(fn) && fn <= fx)) break;  // no step lowers it: as good as it gets
      const s = xn.map((v, j) => v - x[j]), y = gn.map((v, j) => v - g[j]);
      if (dot(s, y) > 1e-12) {
        S.push(s); Y.push(y);
        if (S.length > 10) { S.shift(); Y.shift(); }
      }
      const small = fx - fn <= 1e-12 * Math.max(1, Math.abs(fx));
      x = xn; fx = fn; g = gn;
      if (small) break;
    }
    return x;
  }

  class Bayes3 {
    constructor(params) {
      this.P = Object.assign({ theta: 0.45, decay: 0.99, window: 300, step_factor: 10, min_steps: 50,
        prior_mean: 0, prior_sd: 1.5, spread: 1, tau: 0.5, tau_sd: 0.5, worse: 0.35, worse_strength: 10 }, params);
      const B = B3.BINS;
      this.skill = new Array(B).fill(this.P.prior_mean);
      this.level = this.P.prior_mean;
      this.logTau = Math.log(this.P.tau);
      this.history = [];  // per puzzle: [optimal moves, moves] of the player's own, per distance bin
      this.worseMoves = new Array(B).fill(0);
      this.mistakes = new Array(B).fill(0);
      this.pending = false;
    }

    beginPuzzle(d, K) {  // d: the start's distance; K: the largest distance of any board of the puzzle
      this.endPuzzle();
      const B = B3.BINS;
      this.d = d;
      this.K = K;
      this.cap = Math.max(this.P.min_steps, Math.round(this.P.step_factor * d));
      this.optimal = new Array(B).fill(0);
      this.own = new Array(B).fill(0);
      this.worse = new Array(B).fill(0);
      this.mist = new Array(B).fill(0);
      this.shift = B3.LOG_PZ.slice();  // log belief over the puzzle's difficulty, at the points Z (units of tau)
      this.pending = true;
      this.plan();
    }

    observe(k, after, taught) {  // a move from distance k to `after`; shown moves say nothing about skill
      if (!this.pending || taught || k === 0) return;
      const b = Math.min(k, B3.BINS) - 1, good = after === k - 1, tau = Math.exp(this.logTau);
      this.own[b] += 1;
      if (good) this.optimal[b] += 1;
      else {
        this.mist[b] += 1;
        if (after === k + 1) this.worse[b] += 1;
      }
      B3.Z.forEach((z, i) => {
        const logit = this.skill[b] + tau * z;
        this.shift[i] += logSigmoid(good ? logit : -logit);
      });
    }

    solveAlone(k, moves) {  // the chance of solving untaught from distance k, `moves` made on the puzzle
      if (k === 0) return 1;
      if (moves >= this.cap) return 0;
      const w = softmax(this.shift), K1 = this.K + 1, base = moves * B3.Z.length * K1, kk = Math.min(k, this.K);
      return w.reduce((s, wz, z) => s + wz * this.alone[base + z * K1 + kk], 0);
    }

    wantsToTeach(k, moves) { return k > 0 && this.solveAlone(k, moves) < this.P.theta; }

    puzzleShift() {  // the belief's mean shift of this puzzle's logits, against a typical puzzle
      const tau = Math.exp(this.logTau);
      return dot(softmax(this.shift), B3.Z.map((z) => tau * z));
    }

    beliefs() {  // what it believes about the player, for the record
      const r = (x) => Math.round(x * 1e4) / 1e4, B = B3.BINS;
      const share = (b) => (this.P.worse_strength * this.P.worse + this.worseMoves[b]) /
        (this.P.worse_strength + this.mistakes[b]);
      return { skill: this.skill.map(r), level: r(this.level), tau: r(Math.exp(this.logTau)),
        worse: Array.from({ length: B }, (_, b) => r(share(b))), puzzles: this.history.length };
    }

    endPuzzle() {  // folds the finished puzzle's evidence into the beliefs about the player
      if (!this.pending) return;
      this.pending = false;
      this.history.push([this.optimal, this.own]);
      if (this.history.length > this.P.window) this.history.shift();
      for (let b = 0; b < B3.BINS; b++) {
        this.worseMoves[b] = this.P.decay * this.worseMoves[b] + this.worse[b];
        this.mistakes[b] = this.P.decay * this.mistakes[b] + this.mist[b];
      }
      this.fit();
    }

    fit() {  // MAP skill per distance, overall level and tau, each puzzle's difficulty integrated out
      const B = B3.BINS, Z = B3.Z, NZ = Z.length, P = this.P, H = this.history.length;
      const weight = this.history.map((_, h) => Math.pow(P.decay, H - 1 - h));
      const logTau0 = Math.log(P.tau);
      const objective = (x) => {
        const skill = x.slice(0, B), level = x[B], logTau = x[B + 1], tau = Math.exp(logTau);
        const up = Z.map((z) => skill.map((s) => logSigmoid(s + tau * z)));  // log chance optimal [z][b]
        const down = Z.map((z) => skill.map((s) => logSigmoid(-(s + tau * z))));
        const rOpt = Z.map(() => new Array(B).fill(0)), rOwn = Z.map(() => new Array(B).fill(0));
        let value = 0;
        this.history.forEach(([opt, own], h) => {
          const ll = Z.map((_, z) => {
            let s = B3.LOG_PZ[z];
            for (let b = 0; b < B; b++) if (own[b]) s += opt[b] * up[z][b] + (own[b] - opt[b]) * down[z][b];
            return s;
          });
          const top = Math.max(...ll), lse = top + Math.log(ll.reduce((a, v) => a + Math.exp(v - top), 0));
          value -= weight[h] * lse;
          for (let z = 0; z < NZ; z++) {
            const r = weight[h] * Math.exp(ll[z] - lse);
            for (let b = 0; b < B; b++) { rOpt[z][b] += r * opt[b]; rOwn[z][b] += r * own[b]; }
          }
        });
        const grad = new Array(B + 2).fill(0);
        let gTau = 0;
        for (let z = 0; z < NZ; z++) {
          let row = 0;
          for (let b = 0; b < B; b++) {
            const resid = rOpt[z][b] - rOwn[z][b] / (1 + Math.exp(-(skill[b] + tau * Z[z])));
            grad[b] -= resid;
            row += resid;
          }
          gTau += row * Z[z];
        }
        const sp2 = P.spread * P.spread;
        let dev = 0;
        for (let b = 0; b < B; b++) {
          value += (skill[b] - level) ** 2 / (2 * sp2);
          grad[b] += (skill[b] - level) / sp2;
          dev += skill[b] - level;
        }
        value += (level - P.prior_mean) ** 2 / (2 * P.prior_sd ** 2) + (logTau - logTau0) ** 2 / (2 * P.tau_sd ** 2);
        grad[B] = -dev / sp2 + (level - P.prior_mean) / P.prior_sd ** 2;
        grad[B + 1] = -tau * gTau + (logTau - logTau0) / P.tau_sd ** 2;
        return [value, grad];
      };
      const x = lbfgs(objective, [...this.skill, this.level, this.logTau]);
      this.skill = x.slice(0, B);
      this.level = x[B];
      this.logTau = x[B + 1];
    }

    plan() {  // this.alone[(moves made, difficulty, k)]: the chance of solving untaught from there
      const B = B3.BINS, Z = B3.Z, NZ = Z.length, K = this.K, K1 = K + 1, cap = this.cap, P = this.P;
      const tau = Math.exp(this.logTau);
      const bin = (k) => Math.min(Math.max(k, 1), B) - 1;
      const p = new Float64Array(NZ * K1), worse = new Float64Array(K1);
      for (let k = 0; k <= K; k++) {
        const b = bin(k);
        worse[k] = (P.worse_strength * P.worse + this.worseMoves[b]) / (P.worse_strength + this.mistakes[b]);
        for (let z = 0; z < NZ; z++) p[z * K1 + k] = 1 / (1 + Math.exp(-(this.skill[b] + tau * Z[z])));
      }
      this.alone = new Float64Array(cap * NZ * K1);
      let alone = new Float64Array(NZ * K1);  // at the cap: solved only if red is out
      for (let z = 0; z < NZ; z++) alone[z * K1] = 1;
      for (let m = cap - 1; m >= 0; m--) {
        const next = new Float64Array(NZ * K1);
        for (let z = 0; z < NZ; z++) {
          const o = z * K1;
          next[o] = 1;
          for (let k = 1; k <= K; k++) {
            const pk = p[o + k], w = worse[k];
            next[o + k] = pk * alone[o + k - 1] + (1 - pk) * (w * alone[o + Math.min(k + 1, K)] + (1 - w) * alone[o + k]);
          }
        }
        alone = next;
        this.alone.set(alone, m * NZ * K1);
      }
    }
  }
  // BAYES3-MODEL-END
  const model = KIND === "bayes3" ? new Bayes3(BAYES3) : null;

  const SESSION =(crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()).replace(/[^a-zA-Z0-9-]/g, "");
  const order = POOL.map((p) => p.index);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }

  const boardEl = document.getElementById("board");
  const restartBtn = document.getElementById("restart");
  const giveUpBtn = document.getElementById("give-up");
  const nextBtn = document.getElementById("next");
  const exportBtn = document.getElementById("export");
  const problemEl = document.getElementById("problem");
  const tuningEl = document.getElementById("tuning");
  const delayInput = document.getElementById("delay");
  const delayOut = document.getElementById("delay-out");

  // --- recording -----------------------------------------------------------------------------
  const rec = { db: null, uid: null, ready: false, failed: false };

  // The page says nothing while recording works; only a failure is shown.
  function showProblem(text) {
    problemEl.textContent = text;
    problemEl.hidden = !text;
  }

  class Game {
    constructor(puzzle, number) {
      this.puzzle = puzzle;
      this.number = number;
      this.id = SESSION + "-" + number;
      this.startedAt = new Date().toISOString();
      this.t0 = performance.now();
      this.moves = [];
      this.restarts = [];
      this.checks = [];    // the Bayesian teacher's decisions, each time the delay ran out
      this.beliefs = null; // what it believed about the player when the puzzle started
      this.delay = delay === null ? null : delay / 1000;  // the teacher's wait at the start, seconds
      this.delayChanges = [];  // the owner's testing slider, if moved during the game
      this.outcome = "playing";
      this.endedAt = null;
      this.dirty = true;
      this.inflight = false;
      this.timer = null;
    }
    elapsed() { return Math.round(performance.now() - this.t0); }
    body() {
      return {
        version: 3,
        session: SESSION,
        teacher: TEACHER,
        delay: this.delay,
        delayChanges: this.delayChanges,
        number: this.number,
        poolIndex: this.puzzle.index,
        board: this.puzzle.board,
        distance: this.puzzle.distance,
        startedAt: this.startedAt,
        endedAt: this.endedAt,
        outcome: this.outcome,
        moveCount: this.moves.length,
        attempts: this.restarts.length + 1,
        moves: this.moves,
        restarts: this.restarts,
        checks: this.checks,
        beliefs: this.beliefs,
      };
    }
    touch(now) {
      this.dirty = true;
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.flush(), now ? 0 : 1500);
    }
    async flush() {
      if (!rec.ready || rec.failed || this.inflight || !this.dirty) return;
      this.inflight = true;
      this.dirty = false;
      const ref = rec.db.collection("plays/" + rec.uid + "/games").doc(this.id);
      try {
        await ref.set(this.body());
      } catch (e) {
        this.dirty = true;
        handleWriteError(e, () => this.flush());
      } finally {
        this.inflight = false;
      }
      if (this.dirty && !rec.failed) this.touch(false);
    }
  }

  let retried = false;
  function handleWriteError(e, retry) {
    const code = e && e.code;
    if (code === "unavailable" && !retried) {
      retried = true;
      setTimeout(retry, 1500 + Math.random() * 1500);
      return;
    }
    rec.failed = true;
    if (code === "quota_exceeded") {
      showProblem("Games aren't being saved: the store is full.");
    } else if (code === "invalid_argument") {
      showProblem("Games aren't being saved: your access to this page doesn't allow it.");
    } else {
      showProblem("Games aren't being saved (" + (code || "error") + "). Reload the page to try again.");
    }
  }

  // The teacher's wait, for testing: shown to the owner, and anywhere outside claude.ai.
  function offerTuning() {
    if (delay === null) return;
    const label = () => { delayOut.textContent = delay === 0 ? "at once" : delay / 1000 + " s"; };
    delayInput.value = String(delay / 1000);
    label();
    tuningEl.hidden = false;
    delayInput.addEventListener("input", () => {
      delay = Number(delayInput.value) * 1000;
      label();
    });
    delayInput.addEventListener("change", () => {
      if (game) {
        game.delayChanges.push({ t: game.elapsed(), afterMove: game.moves.length, seconds: delay / 1000 });
        game.touch(false);
      }
      armTeacher();
    });
  }

  async function startRecording() {
    if (!window.claude || typeof window.claude.use !== "function") {
      showProblem("Games aren't being saved: open this page on claude.ai.");
      offerTuning();
      return;
    }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (user && user.isOwner()) offerTuning();
    const uid = user ? await user.id() : null;
    if (!db || !uid) {
      showProblem("Games aren't being saved: sign in to claude.ai.");
      return;
    }
    rec.db = db;
    rec.uid = uid;
    rec.ready = true;
    if (user.isOwner()) offerExport();
    try {
      await db.doc("plays/" + uid).set({ version: 1, lastSession: SESSION, lastSeen: new Date().toISOString() });
    } catch (e) {
      handleWriteError(e, () => {});
      return;
    }
    if (game) game.touch(true);
  }

  // Owner only: every player's games as one JSON file, for scripts/play_data.py.
  async function offerExport() {
    const downloads = await window.claude.use("downloads");
    if (!downloads) return;
    exportBtn.hidden = false;
    exportBtn.addEventListener("click", async () => {
      exportBtn.disabled = true;
      exportBtn.textContent = "Exporting…";
      try {
        const players = (await rec.db.collection("plays").get()).docs;
        const games = [];
        for (const p of players) {
          const snap = await rec.db.collection("plays/" + p.id + "/games").get();
          for (const g of snap.docs) games.push(Object.assign({ player: p.id, id: g.id }, g.data()));
        }
        const data = JSON.stringify({
          version: 1,
          exportedAt: new Date().toISOString(),
          players: players.map((p) => Object.assign({ player: p.id }, p.data())),
          games,
        });
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
        await downloads.save({ filename: "rush_hour_plays_" + stamp + ".json", data });
        exportBtn.textContent = "Exported " + games.length + " games";
      } catch (e) {
        exportBtn.textContent = e && e.code === "declined" ? "Export games" : "Export failed (" + ((e && e.code) || "error") + ")";
      } finally {
        exportBtn.disabled = false;
      }
    });
  }

  // --- the puzzle ------------------------------------------------------------------------------
  let game = null;
  let cars = {};       // letter -> {r, c, len, h}
  let startCars = {};
  let solved = false;
  let played = 0;

  function parse(board) {
    const cells = {};
    for (let i = 0; i < 36; i++) {
      const ch = board[i];
      if (ch === "o" || ch === "x") continue;
      (cells[ch] = cells[ch] || []).push([Math.floor(i / 6), i % 6]);
    }
    const out = {};
    for (const [ch, list] of Object.entries(cells)) {
      const h = list[0][0] === list[1][0];
      out[ch] = { r: list[0][0], c: list[0][1], len: list.length, h };
    }
    return out;
  }

  function walls(board) {
    const set = new Set();
    for (let i = 0; i < 36; i++) if (board[i] === "x") set.add(i);
    return set;
  }

  function occupied(except) {
    const grid = new Array(36).fill(false);
    for (const i of walls(game.puzzle.board)) grid[i] = true;
    for (const [ch, car] of Object.entries(cars)) {
      if (ch === except) continue;
      for (let k = 0; k < car.len; k++) {
        const r = car.r + (car.h ? 0 : k), c = car.c + (car.h ? k : 0);
        grid[r * 6 + c] = true;
      }
    }
    return grid;
  }

  // How far a car can slide back (negative) and forward (positive) from where it is.
  function range(ch) {
    const car = cars[ch], grid = occupied(ch);
    let lo = 0, hi = 0;
    if (car.h) {
      while (car.c + lo - 1 >= 0 && !grid[car.r * 6 + car.c + lo - 1]) lo--;
      while (car.c + car.len + hi <= 5 && !grid[car.r * 6 + car.c + car.len + hi]) hi++;
    } else {
      while (car.r + lo - 1 >= 0 && !grid[(car.r + lo - 1) * 6 + car.c]) lo--;
      while (car.r + car.len + hi <= 5 && !grid[(car.r + car.len + hi) * 6 + car.c]) hi++;
    }
    return [lo, hi];
  }

  const PALETTE = 15;
  function paintFor(ch) {
    if (ch === "A") return "var(--accent)";
    const n = (ch.charCodeAt(0) - 66) % PALETTE;
    return "var(--car-" + (n + 1) + ")";
  }

  function render() {
    boardEl.textContent = "";
    for (const [ch, car] of Object.entries(cars)) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "car " + (car.h ? "h" : "v") + (ch === "A" ? " red" : "");
      el.dataset.car = ch;
      el.style.setProperty("--paint", paintFor(ch));
      el.style.left = (car.c / 6) * 100 + "%";
      el.style.top = (car.r / 6) * 100 + "%";
      el.style.width = ((car.h ? car.len : 1) / 6) * 100 + "%";
      el.style.height = ((car.h ? 1 : car.len) / 6) * 100 + "%";
      el.setAttribute("aria-label", (ch === "A" ? "Red car" : (car.len === 3 ? "Truck " : "Car ") + ch) +
        ", " + (car.h ? "horizontal" : "vertical") + ", row " + (car.r + 1) + ", column " + (car.c + 1));
      boardEl.appendChild(el);
    }
  }

  function newPuzzle() {
    if (model && game) {  // the finished puzzle's evidence goes into the model before the next one starts
      syncModel();
      model.endPuzzle();
    }
    if (game && game.outcome === "playing") {
      game.outcome = "left";
      game.endedAt = new Date().toISOString();
      game.touch(true);
    }
    const puzzle = POOL[order[played % order.length]];
    played += 1;
    game = new Game(puzzle, played);
    if (model) game.beliefs = model.beliefs();
    cars = parse(puzzle.board);
    startCars = JSON.parse(JSON.stringify(cars));
    solved = false;
    teaching = false;
    nextBtn.hidden = true;
    restartBtn.disabled = false;
    giveUpBtn.disabled = false;
    giveUpBtn.textContent = "Give up";
    render();
    game.touch(true);
    startSearch();
    armTeacher();
  }

  // `taught`: the teacher made the move, not the player.
  function move(ch, steps, taught) {
    const car = cars[ch];
    const from = [car.r, car.c];
    const before = model ? boardKey() : 0;
    if (car.h) car.c += steps; else car.r += steps;
    const m = { car: ch, fromRow: from[0], fromCol: from[1], toRow: car.r, toCol: car.c, t: game.elapsed() };
    if (taught) m.taught = true;
    game.moves.push(m);
    if (model) observed.push([before, boardKey(), Boolean(taught)]);
    game.touch(false);
    render();
    if (ch === "A" && car.c + car.len - 1 === 5) win();
    armTeacher();
  }

  // --- the teacher -----------------------------------------------------------------------------
  // "delay:<s>": when the player goes s seconds without a move (counted from the puzzle's start, a
  // restart or the last move, the teacher's included), the teacher makes an optimal move for them -
  // one of those bringing the red car a move closer to the edge, a slide of any length being one
  // move as in the repo's distances. The clock stops while the page is hidden.
  //
  // "bayes3:<s>[:<name>=<value>,...]": the same clock, but when it runs out the Bayesian teacher (Bayes3, above)
  // makes the move only if its model gives the player under `theta` (0.45) chance of solving the puzzle alone
  // from here; otherwise it waits for the player's next move, which starts the clock again. Once it has shown a
  // move, the clock starts again too, so while the chance stays low it goes on showing a move per `s` seconds -
  // as far as the player needs, then hands the puzzle back. Its beliefs about the player last the whole visit.
  // Parameters may be set in the spec, by teach.py's names, e.g. bayes3:10:theta=0.3.
  //
  // The owner (and anyone opening the page outside claude.ai) gets a slider for the wait, for testing; 0 means at
  // once, as the simulated sessions' teacher. Games record the wait and any change to it.
  let teachTimer = null;
  let teachPending = false;  // the delay ran out mid-drag: teach when the drag ends, unless it moves a car
  let teaching = false;      // the teacher's car is sliding: input waits
  let search = null;         // {puzzle, steps (the search, resumable), result}, for the current puzzle

  // Distance to the goal of every board reachable from the puzzle's start. A board is each car's
  // position along its axis (column if horizontal, row if vertical), keyed as a base-6 number. Big
  // puzzles reach ~100k boards, so this is a generator, run in slices from the start of the puzzle.
  const key = (pos) => pos.reduce((k, x) => k * 6 + x, 0);
  function* solve(puzzle) {
    const start = parse(puzzle.board), wall = walls(puzzle.board);
    const letters = Object.keys(start), spec = letters.map((ch) => start[ch]);
    const red = letters.indexOf("A");
    const cell = (car, x) => (car.h ? car.r * 6 + x : x * 6 + car.c);
    const next = (pos) => {
      const grid = new Array(36).fill(false);
      for (const i of wall) grid[i] = true;
      spec.forEach((car, i) => { for (let k = 0; k < car.len; k++) grid[cell(car, pos[i] + k)] = true; });
      const out = [];
      spec.forEach((car, i) => {
        for (const dir of [-1, 1]) {
          for (let p = pos[i]; ; ) {
            const lead = dir < 0 ? p - 1 : p + car.len;
            if (lead < 0 || lead > 5 || grid[cell(car, lead)]) break;
            p += dir;
            const q = pos.slice();
            q[i] = p;
            out.push(q);
          }
        }
      });
      return out;
    };
    const pos0 = spec.map((car) => (car.h ? car.c : car.r));
    const seen = new Set([key(pos0)]), all = [pos0];
    for (let i = 0; i < all.length; i++) {
      for (const q of next(all[i])) {
        const k = key(q);
        if (!seen.has(k)) { seen.add(k); all.push(q); }
      }
      if (i % 500 === 499) yield;
    }
    const dist = new Map(), queue = all.filter((p) => p[red] + spec[red].len - 1 === 5);
    for (const p of queue) dist.set(key(p), 0);
    let far = 0;
    for (let i = 0; i < queue.length; i++) {  // moves are reversible: search back from the goals
      const d = dist.get(key(queue[i]));
      far = d;
      for (const q of next(queue[i])) {
        const k = key(q);
        if (!dist.has(k)) { dist.set(k, d + 1); queue.push(q); }
      }
      if (i % 500 === 499) yield;
    }
    return { letters, next, dist, far };
  }

  function startSearch() {
    search = null;
    if (delay === null) return;
    const s = { puzzle: game.puzzle, steps: solve(game.puzzle), result: null };
    search = s;
    const run = () => {
      if (search !== s || s.result) return;
      const t = performance.now();
      for (let r = s.steps.next(); ; r = s.steps.next()) {
        if (r.done) { s.result = r.value; return; }
        if (performance.now() - t > 12) { setTimeout(run, 0); return; }
      }
    };
    setTimeout(run, 0);
  }

  // The current puzzle's search, finished now if it hasn't yet.
  function solver() {
    if (!search || search.puzzle !== game.puzzle) startSearch();
    while (!search.result) {
      const r = search.steps.next();
      if (r.done) search.result = r.value;
    }
    return search.result;
  }

  let observed = [];   // [board before, board after, taught] per move the model hasn't counted yet
  let modelGame = null;  // the game whose puzzle the model has begun
  const boardKey = () => key(Object.keys(startCars).map((ch) => (cars[ch].h ? cars[ch].c : cars[ch].r)));

  // Brings the model up to date with the current game: begins its puzzle if it hasn't yet, and counts the moves
  // made since the last call (both need the puzzle's distances, so this waits for its search).
  function syncModel() {
    if (!model || !game) return;
    const { dist, far } = solver();
    if (modelGame !== game) {
      modelGame = game;
      model.beginPuzzle(dist.get(key(Object.keys(startCars).map((ch) => (startCars[ch].h ? startCars[ch].c : startCars[ch].r)))), far);
    }
    for (const [before, after, taught] of observed.splice(0)) model.observe(dist.get(before), dist.get(after), taught);
  }

  function armTeacher() {
    clearTimeout(teachTimer);
    teachPending = false;
    if (delay === null || solved || !game || document.visibilityState === "hidden") return;
    teachTimer = setTimeout(teach, delay);
  }

  function teach() {
    if (solved || teaching) return;
    if (drag) { teachPending = true; return; }
    const { letters, next, dist } = solver();
    const pos = letters.map((ch) => (cars[ch].h ? cars[ch].c : cars[ch].r));
    const d = dist.get(key(pos));
    if (model) {
      syncModel();
      const moves = game.moves.length, chance = model.solveAlone(d, moves), shown = chance < model.P.theta;
      const round = (x) => Math.round(x * 1e4) / 1e4;
      game.checks.push({ t: game.elapsed(), afterMove: moves, distance: d, delay: delay / 1000,
        solveAlone: round(chance), shift: round(model.puzzleShift()), shown });
      game.touch(false);
      if (!shown) return;  // the player's next move starts the clock again
    }
    const options = next(pos).filter((q) => dist.get(key(q)) === d - 1);
    if (!options.length) return;
    const q = options[Math.floor(Math.random() * options.length)];
    const i = q.findIndex((x, j) => x !== pos[j]);
    const ch = letters[i], steps = q[i] - pos[i];
    const el = boardEl.querySelector('[data-car="' + ch + '"]');
    const px = (steps * boardEl.clientWidth) / 6;
    const g = game;
    teaching = true;
    el.classList.add("teaching");
    el.style.transform = cars[ch].h ? "translateX(" + px + "px)" : "translateY(" + px + "px)";
    setTimeout(() => {
      if (game !== g || !teaching) return;
      teaching = false;
      move(ch, steps, true);
      const moved = boardEl.querySelector('[data-car="' + ch + '"]');
      if (moved && !solved) moved.classList.add("taught");
    }, 340);
  }

  function win() {
    solved = true;
    game.outcome = "solved";
    game.endedAt = new Date().toISOString();
    game.touch(true);
    restartBtn.disabled = true;
    giveUpBtn.disabled = true;
    nextBtn.hidden = false;
    const red = boardEl.querySelector('[data-car="A"]');
    if (red) {
      red.classList.add("leaving");
      requestAnimationFrame(() => { red.style.transform = "translateX(" + boardEl.clientWidth * 0.45 + "px)"; red.style.opacity = "0"; });
    }
    const banner = document.createElement("div");
    banner.className = "banner";
    const p = document.createElement("p");
    p.textContent = "Solved in " + game.moves.length + " move" + (game.moves.length === 1 ? "" : "s");
    banner.appendChild(p);
    boardEl.appendChild(banner);
    nextBtn.focus();
  }

  restartBtn.addEventListener("click", () => {
    if (solved || !game || teaching) return;
    game.restarts.push({ t: game.elapsed(), afterMove: game.moves.length });
    cars = JSON.parse(JSON.stringify(startCars));
    game.touch(false);
    render();
    armTeacher();
  });
  giveUpBtn.addEventListener("click", () => {
    if (solved || !game || teaching) return;
    game.outcome = "gave_up";
    game.endedAt = new Date().toISOString();
    game.touch(true);
    newPuzzle();
  });
  nextBtn.addEventListener("click", newPuzzle);

  // --- dragging --------------------------------------------------------------------------------
  let drag = null;
  boardEl.addEventListener("pointerdown", (e) => {
    const el = e.target.closest(".car");
    if (!el || solved || teaching) return;
    const ch = el.dataset.car;
    const [lo, hi] = range(ch);
    drag = { el, ch, lo, hi, x: e.clientX, y: e.clientY, cell: boardEl.clientWidth / 6, offset: 0, id: e.pointerId };
    el.setPointerCapture(e.pointerId);
    el.classList.add("dragging");
    e.preventDefault();
  });
  boardEl.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const car = cars[drag.ch];
    const delta = (car.h ? e.clientX - drag.x : e.clientY - drag.y) / drag.cell;
    drag.offset = Math.max(drag.lo, Math.min(drag.hi, delta));
    drag.el.style.transform = car.h ? "translateX(" + drag.offset * drag.cell + "px)" : "translateY(" + drag.offset * drag.cell + "px)";
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const { el, ch, offset } = drag;
    drag = null;
    el.classList.remove("dragging");
    const steps = Math.round(offset);
    if (steps !== 0) {
      move(ch, steps);
    } else {
      el.classList.add("settle");
      el.style.transform = "";
      setTimeout(() => el.classList.remove("settle"), 160);
      if (teachPending) {
        teachPending = false;
        setTimeout(teach, 160);
      }
    }
  }
  boardEl.addEventListener("pointerup", endDrag);
  boardEl.addEventListener("pointercancel", endDrag);

  boardEl.addEventListener("keydown", (e) => {
    const el = e.target.closest(".car");
    if (!el || solved || teaching) return;
    const ch = el.dataset.car, car = cars[ch];
    const dir = { ArrowLeft: car.h ? -1 : 0, ArrowRight: car.h ? 1 : 0, ArrowUp: car.h ? 0 : -1, ArrowDown: car.h ? 0 : 1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const [lo, hi] = range(ch);
    if (dir < lo || dir > hi) return;
    move(ch, dir);
    const again = boardEl.querySelector('[data-car="' + ch + '"]');
    if (again && !solved) again.focus();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && game) game.touch(true);
    armTeacher();
  });

  newPuzzle();
  startRecording();
})();
</script>
